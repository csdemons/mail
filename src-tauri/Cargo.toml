[package]
name = "rrcki-mail"
version = "0.1.2"
description = "RRCKI Mail — корпоративный почтовый клиент"
authors = ["RRCKI"]
license = ""
edition = "2021"
rust-version = "1.80"

[lib]
name = "rrcki_mail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
tauri-plugin-log = "2"
tokio = { version = "1", features = ["net", "sync", "time", "macros", "rt-multi-thread", "fs"] }
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
tokio-native-tls = "0.3"
native-tls = "0.2"
futures = "0.3"
mail-parser = "0.11"
utf7-imap = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
