[package]
name = "rrcki-mail"
version = "0.19.0"
description = "RRCKI Mail — корпоративный почтовый клиент"
authors = ["RRCKI"]
license = ""
edition = "2021"
rust-version = "1.82"

[lib]
name = "rrcki_mail_lib"
# Только десктоп: cdylib/staticlib нужны лишь для мобильных сборок и ломают
# компоновку MinGW (больше 65535 экспортов в DLL).
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
tauri-plugin-log = "2"
tokio = { version = "1", features = ["net", "sync", "time", "macros", "rt-multi-thread", "fs"] }
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
tokio-native-tls = "0.3"
native-tls = "0.2"
futures = "0.3"
mail-parser = "0.11"
base64 = "0.22"
utf7-imap = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-native-tls", "hostname"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "charset", "json", "stream"] }
bytes = "1"
roxmltree = "0.20"
ical = { version = "0.11", default-features = false, features = ["ical", "vcard"] }
rrule = "0.13"
chrono-tz = "0.9"
mime_guess = "2"
ammonia = "4"
percent-encoding = "2"
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
getrandom = "0.2"
chacha20poly1305 = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
# Чтение файлов Outlook (.pst/.ost) для импорта почты (Microsoft, MIT).
outlook-pst = "1.2"
encoding_rs = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Копия outlook-pst с исправлением чтения (vendor/outlook-pst/VENDORED.md).
[patch.crates-io]
outlook-pst = { path = "../vendor/outlook-pst" }
