[package]
name = "rrcki-mail"
version = "0.5.1"
description = "RRCKI Mail — корпоративный почтовый клиент"
authors = ["RRCKI"]
license = ""
edition = "2021"
rust-version = "1.80"

[lib]
name = "rrcki_mail_lib"
# Только десктоп: cdylib/staticlib нужны лишь для мобильных сборок и ломают
# компоновку MinGW (больше 65535 экспортов в DLL).
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
tauri-plugin-log = "2"
tokio = { version = "1", features = ["net", "sync", "time", "macros", "rt-multi-thread", "fs"] }
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
tokio-native-tls = "0.3"
native-tls = "0.2"
futures = "0.3"
mail-parser = "0.11"
utf7-imap = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-native-tls", "hostname"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "charset", "json"] }
roxmltree = "0.20"
ical = { version = "0.11", default-features = false, features = ["ical", "vcard"] }
rrule = "0.13"
chrono-tz = "0.9"
mime_guess = "2"
ammonia = "4"
percent-encoding = "2"
sha2 = "0.10"
url = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
