name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Токен по умолчанию — только чтение; запись нужна лишь задаче релиза.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & unit tests
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm, cache-dependency-path: '**/package-lock.json' }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable, components: clippy }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { workspaces: src-tauri }
      - name: System deps
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libsecret-1-dev
      - name: CHANGELOG has a section for this version
        run: |
          app=$(node -p "require('./src-tauri/tauri.conf.json').version")
          grep -q "^## $app\$" CHANGELOG.md || { echo "CHANGELOG.md: нет раздела $app"; exit 1; }
      - name: npm ci (с повтором при зависании)
        timeout-minutes: 25
        shell: bash
        run: |
          for i in 1 2 3; do
            timeout 420 npm ci --no-audit --no-fund && exit 0
            echo "npm ci — попытка $i не удалась"; sleep 15
          done
          exit 1
      - name: Known vulnerabilities in npm dependencies (production)
        run: npm --prefix frontend audit --omit=dev --audit-level=high
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run build
      - name: Known vulnerabilities in Rust dependencies (RustSec)
        timeout-minutes: 15
        run: |
          command -v cargo-audit >/dev/null || cargo install cargo-audit --locked
          (cd src-tauri && cargo audit)
          (cd legacy && cargo audit)
      - name: cargo clippy
        working-directory: src-tauri
        # Замечания — ещё и аннотациями: их видно в API без загрузки полного журнала.
        run: |
          if ! cargo clippy --all-targets --message-format=short -- -D warnings 2>clippy.txt; then
            cat clippy.txt
            grep -E 'error|warning' clippy.txt | grep -v '^warning: build failed' | head -20 \
              | sed -E 's#^([^ :]+\.rs):([0-9]+):[0-9]+: (.*)$#::error file=src-tauri/\1,line=\2::\3#; t; s#^#::error::#'
            exit 1
          fi
          cat clippy.txt
      - run: cargo test
        working-directory: src-tauri

  bundle:
    name: Bundle (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 (glibc 2.35) — бинарник совместим с Astra Linux SE 1.8 / Debian 12
          - { name: linux, os: ubuntu-22.04, bundles: 'deb,rpm,appimage' }
          - { name: windows, os: windows-latest, bundles: 'nsis,msi' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm, cache-dependency-path: '**/package-lock.json' }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { workspaces: src-tauri }
      - name: System deps (Linux)
        timeout-minutes: 20
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libsecret-1-dev rpm
      - name: npm ci (с повтором при зависании)
        timeout-minutes: 25
        shell: bash
        run: |
          for i in 1 2 3; do
            timeout 420 npm ci --no-audit --no-fund && exit 0
            echo "npm ci — попытка $i не удалась"; sleep 15
          done
          exit 1
      - run: npx tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rrcki-mail-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  # Windows 8/8.1: стандартные цели Rust требуют Windows 10, поэтому отдельная
  # сборка под x86_64-win7-windows-msvc (std собирается из исходников).
  # WebView2 на этих системах — последняя поддерживаемая версия 109.
  bundle-win8:
    name: Bundle (windows 8/8.1)
    needs: check
    timeout-minutes: 60
    # Кросс-сборка MinGW на Linux — тот же путь, что проверен локально.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm, cache-dependency-path: '**/package-lock.json' }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable, components: rust-src }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { workspaces: src-tauri, key: win7-gnu }
      - name: Cross toolchain
        timeout-minutes: 20
        # libayatana-appindicator — tauri-cli проверяет её при упаковке (значок в трее).
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 nsis libayatana-appindicator3-1
      - name: npm ci (с повтором при зависании)
        timeout-minutes: 25
        shell: bash
        run: |
          for i in 1 2 3; do
            timeout 420 npm ci --no-audit --no-fund && exit 0
            echo "npm ci — попытка $i не удалась"; sleep 15
          done
          exit 1
      - run: npm --prefix frontend run build
      - name: Build (x86_64-win7-windows-gnu, std from source)
        working-directory: src-tauri
        env: { RUSTC_BOOTSTRAP: '1' }
        run: |
          set -o pipefail
          cargo build --release -Zbuild-std=std,panic_abort --target x86_64-win7-windows-gnu --features tauri/custom-protocol 2>&1 | tee build.log \
            || { grep -E '^error' -A12 build.log | head -60 | sed 's/^/::error::/'; exit 1; }
      - name: Bundle NSIS
        run: |
          set -o pipefail
          npx tauri bundle --verbose --target x86_64-win7-windows-gnu --bundles nsis 2>&1 | tee bundle.log \
            || { tail -40 bundle.log | sed 's/^/::error::/'; exit 1; }
      - name: Rename installer
        run: |
          cd src-tauri/target/x86_64-win7-windows-gnu/release/bundle/nsis
          for f in *-setup.exe; do mv "$f" "$(echo "$f" | sed 's/^RRCKI Mail/rrcki-mail/; s/ /-/g; s/-setup\.exe$/-setup-windows8.exe/')"; done
          ls -la
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rrcki-mail-windows8
          path: src-tauri/target/x86_64-win7-windows-gnu/release/bundle/nsis/*-windows8.exe
          if-no-files-found: error

  # Astra Linux SE 1.7 (база Debian 10: glibc 2.28, WebKitGTK 4.0 — без 4.1):
  # та же программа на Tauri 1 (каталог legacy/), сборка в контейнере Debian 10.
  bundle-astra17:
    name: Bundle (astra 1.7)
    needs: check
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    container: debian:10
    steps:
      - name: Debian 10 packages (archive)
        timeout-minutes: 20
        run: |
          printf 'deb http://archive.debian.org/debian buster main\ndeb http://archive.debian.org/debian-security buster/updates main\n' > /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates git pkg-config dpkg-dev file \
            libwebkit2gtk-4.0-dev libgtk-3-dev libsoup2.4-dev libssl-dev libdbus-1-dev librsvg2-dev
          dpkg -l libc6 'libwebkit2gtk-4.0*' | grep ^ii
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { workspaces: legacy }
      - name: npm ci (с повтором при зависании)
        timeout-minutes: 25
        shell: bash
        run: |
          for i in 1 2 3; do
            timeout 420 npm ci --no-audit --no-fund && exit 0
            echo "npm ci — попытка $i не удалась"; sleep 15
          done
          exit 1
      - name: Frontend (Tauri 1 IPC)
        run: npm --prefix frontend run build:legacy
      - name: Version from src-tauri/tauri.conf.json
        id: ver
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          node -e "const f='legacy/tauri.conf.json',c=require('./'+f);c.package.version='$v';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build
        working-directory: legacy
        run: cargo build --release --features custom-protocol
      - name: Package .deb
        run: |
          legacy/package-deb.sh "${{ steps.ver.outputs.version }}" dist-astra17
          objdump -T legacy/target/release/rrcki-mail | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rrcki-mail-astra17
          path: dist-astra17/*.deb
          if-no-files-found: error

  # Релиз создаётся автоматически: пуш в main с новой версией в tauri.conf.json,
  # для которой ещё нет релиза → пакеты прикрепляются к релизу v<версия>.
  release:
    name: GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [bundle, bundle-win8, bundle-astra17]
    runs-on: ubuntu-22.04
    # Секрет подписи обновлений хранится в среде «release»: настройте в ней обязательное
    # подтверждение (Settings → Environments → release → Required reviewers) и перенесите
    # туда UPDATE_SIGNING_KEY — тогда изменённый workflow не получит ключ без вашего одобрения.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Version and existing release
        id: ver
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Релиз v$v уже есть — пропускаю"; echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.ver.outputs.exists == 'false'
        with: { path: dist, merge-multiple: true }
      - name: File names without spaces
        if: steps.ver.outputs.exists == 'false'
        run: |
          find dist -type f | while read -r f; do
            # Обычный deb — для Astra 1.8: в имени явно, чтобы на 1.7 не ставили его по ошибке.
            n="$(dirname "$f")/$(basename "$f" | sed 's/^RRCKI Mail/rrcki-mail/; s/ /-/g; s/_amd64\.deb$/_amd64-astra1.8.deb/')"
            [ "$f" = "$n" ] || mv "$f" "$n"
          done
          find dist -type f -printf '%f  %s bytes\n'
      - name: Release notes from CHANGELOG.md
        if: steps.ver.outputs.exists == 'false'
        run: |
          v="${{ steps.ver.outputs.version }}"
          awk -v h="## $v" '$0==h{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          cat >> notes.md <<'TXT'

          ### Установка
          - **Windows 10/11:** `rrcki-mail_*_x64-setup.exe` (или `.msi` для GPO). Ставится поверх предыдущей версии, настройки и пароли сохраняются.
          - **Windows 8/8.1:** `rrcki-mail_*_x64-setup-windows8.exe` (нужен WebView2 Runtime 109 — последняя версия для этих систем).
          - **Astra Linux SE 1.7:** только `rrcki-mail_*_amd64-astra1.7.deb` → `sudo apt install ./rrcki-mail_*_amd64-astra1.7.deb`
          - **Astra Linux SE 1.8 / Debian 12 / Ubuntu 22.04+:** `rrcki-mail_*_amd64-astra1.8.deb` → `sudo apt install ./rrcki-mail_*_amd64-astra1.8.deb`
          - Узнать версию Astra: `cat /etc/astra_version`. Пакет для 1.8 на 1.7 не встанет (нет WebKitGTK 4.1) — и наоборот ставить не нужно.
          - **RED OS / ALT / Fedora:** `.rpm`; любой дистрибутив — `.AppImage` (`chmod +x` и запустить).
          TXT
      - name: latest.json (встроенное обновление)
        if: steps.ver.outputs.exists == 'false'
        run: python3 .github/latest_json.py "${{ steps.ver.outputs.version }}" dist notes.md "$GITHUB_REPOSITORY"
      - name: SBOM (перечень компонентов) и SHA256SUMS
        if: steps.ver.outputs.exists == 'false'
        run: |
          v="${{ steps.ver.outputs.version }}"
          python3 .github/sbom_cargo.py src-tauri/Cargo.lock atom-mail "$v" > dist/sbom-rust.cdx.json
          python3 .github/sbom_cargo.py legacy/Cargo.lock atom-mail-astra17 "$v" > dist/sbom-rust-astra17.cdx.json
          (cd frontend && npm sbom --omit dev --sbom-format cyclonedx --package-lock-only) > dist/sbom-frontend.cdx.json
          (cd dist && find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' ! -name '*.sig' -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - name: Подпись latest.json и SHA256SUMS.txt (Ed25519)
        if: steps.ver.outputs.exists == 'false'
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::Нет секрета UPDATE_SIGNING_KEY — релиз без подписи не публикуется (клиенты его не примут)."
            exit 1
          fi
          umask 077
          key="$RUNNER_TEMP/update-signing.pem"
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
          pub=$(openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | base64)
          grep -qF "\"$pub\"" src-tauri/src/updater.rs || { rm -f "$key"; echo "::error::Ключ подписи не соответствует открытому ключу в updater.rs"; exit 1; }
          for f in latest.json SHA256SUMS.txt; do
            openssl pkeyutl -sign -inkey "$key" -rawin -in "dist/$f" | base64 -w0 > "dist/$f.sig"
            openssl pkeyutl -verify -pubin -inkey <(openssl pkey -in "$key" -pubout) -rawin -in "dist/$f" -sigfile <(base64 -d "dist/$f.sig")
          done
          rm -f "$key"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: steps.ver.outputs.exists == 'false'
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Atom Mail ${{ steps.ver.outputs.version }}
          body_path: notes.md
          files: dist/**/*
          fail_on_unmatched_files: true
